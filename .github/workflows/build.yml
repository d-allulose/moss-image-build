name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 阿里云 ACR（个人版实例，国内拉取快）：构建完同时推一份
      - uses: docker/login-action@v3
        with:
          registry: crpi-o9hgi6pwupkrugay.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 共绩镜像仓库（与 GPU 同集群，节点内网拉取最快）
      - uses: docker/login-action@v3
        with:
          registry: harborpush.suanleme.cn
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 关掉 SLSA provenance / SBOM：阿里云 ACR 不认识 OCI empty artifact，
          # 会报 "denied: unknown manifest class for application/vnd.oci.empty.v1+json"
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            harborpush.suanleme.cn/${{ secrets.HARBOR_USERNAME }}/moss-image-build:latest
            harborpush.suanleme.cn/${{ secrets.HARBOR_USERNAME }}/moss-image-build:${{ github.sha }}
            crpi-o9hgi6pwupkrugay.cn-hangzhou.personal.cr.aliyuncs.com/dallulose/moss-image-build:latest
            crpi-o9hgi6pwupkrugay.cn-hangzhou.personal.cr.aliyuncs.com/dallulose/moss-image-build:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
