name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2026-10-29 改：只推 ghcr（GitHub 自家 registry，海外 runner 推送快）。
      # 历史上试过同时推 Harbor / 阿里云 ACR：17.7GB 从 GHA 跨境推国内只有 ~1MB/s，
      # run #11 推了 4h45m 仍未完成（#8 也卡 2h+，随时撞 6h 上限）。
      # 现在 Harbor 由国内中转机补齐：tools/harbor_relay.sh（见 docs/gongji-deploy.md §14）。
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 关掉 SLSA provenance / SBOM：部分国内 registry 不认识 OCI empty artifact，
          # 会报 "denied: unknown manifest class for application/vnd.oci.empty.v1+json"
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
