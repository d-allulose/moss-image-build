name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 2026-11-04 改：镜像瘦身到 5–6GB 后重新开启 Harbor 直推。
      # 历史教训：17.7GB 从 GHA 跨境推国内只有 ~1MB/s（run #11 推了 4h45m 未完成），
      # 所以当时改成只推 ghcr + 国内中转机（tools/harbor_relay.sh）。
      # 现在两阶段构建把镜像压到 1/3，跨境推送时间可接受，省掉中转机这一步。
      - uses: docker/login-action@v3
        with:
          registry: harborpush.suanleme.cn
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 关掉 SLSA provenance / SBOM：部分国内 registry 不认识 OCI empty artifact，
          # 会报 "denied: unknown manifest class for application/vnd.oci.empty.v1+json"
          provenance: false
          sbom: false
          tags: |
            harborpush.suanleme.cn/${{ secrets.HARBOR_USERNAME }}/moss-image-build:latest
            harborpush.suanleme.cn/${{ secrets.HARBOR_USERNAME }}/moss-image-build:${{ github.sha }}
          # 2026-11-05：只推 Harbor（共绩唯一来源）。之前同时推 ghcr，跨境 4.4GB×2 把
          # 一次构建拖到 2 小时；cache-to 也从 mode=max 改 min，避免再额外导出 4GB 缓存层。
          cache-from: type=gha
          cache-to: type=gha,mode=min
