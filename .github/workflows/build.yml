name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 注：曾经同时推阿里云 ACR，但 GHA runner 跨境推 ACR 太慢（单次多出十几分钟到一小时），
      # 共绩现已改用 Harbor，故只推 Harbor（+ ghcr 留作海外备份），构建时间缩短近一半。
      #
      # 共绩镜像仓库（与 GPU 同集群，节点内网拉取最快）
      - uses: docker/login-action@v3
        with:
          registry: harborpush.suanleme.cn
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 关掉 SLSA provenance / SBOM：阿里云 ACR 不认识 OCI empty artifact，
          # 会报 "denied: unknown manifest class for application/vnd.oci.empty.v1+json"
          provenance: false
          sbom: false
          tags: |
            harborpush.suanleme.cn/${{ secrets.HARBOR_USERNAME }}/moss-image-build:latest
            harborpush.suanleme.cn/${{ secrets.HARBOR_USERNAME }}/moss-image-build:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
